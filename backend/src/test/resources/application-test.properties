# Configuração de banco de dados para testes — substitui o PostgreSQL por H2 in-memory.
# Este arquivo é carregado automaticamente pelo Spring Boot quando o profile "test" está ativo
# (via @ActiveProfiles("test") ou SPRING_PROFILES_ACTIVE=test).
#
# IMPORTANTE: O H2 emula o PostgreSQL com o modo de compatibilidade MODE=PostgreSQL,
# garantindo que as queries JPA funcionem da mesma forma que em produção.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desabilita o Firebase durante os testes (os beans são mockados via @MockBean)
# Evita que o Spring tente carregar o firebase-service-account.json
spring.autoconfigure.exclude=

# Desabilita o Liquibase/Flyway se houver (evita conflito com create-drop do Hibernate)
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Logging mínimo durante testes para manter o output limpo
logging.level.root=WARN
logging.level.com.community=INFO
