# docker-compose.test.yml — Execução isolada de todos os testes do projeto
#
# Uso:
#   docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit
#
# Os dois serviços de teste são independentes e rodam em paralelo.
# O exit code do compose será não-zero se qualquer teste falhar.
#
# IMPORTANTE: Não é necessário ter PostgreSQL, Chrome ou Maven/Node instalados
# na máquina host — tudo roda dentro dos containers.

version: '3.8'

services:

  # ─── Testes do Backend (Spring Boot + JUnit) ────────────────────────────────
  # Usa H2 in-memory (configurado em application-test.properties).
  # Não depende de PostgreSQL.
  backend-test:
    image: maven:3.9.6-eclipse-temurin-17
    container_name: backend-test
    working_dir: /app
    # Monta o código-fonte do backend como volume (sem reconstruir a imagem a cada run)
    volumes:
      - ./backend:/app
      # Cache do repositório Maven entre execuções (evita baixar dependências toda vez)
      - maven_cache:/root/.m2
    environment:
      # Ativa o profile "test" para carregar application-test.properties (H2)
      SPRING_PROFILES_ACTIVE: test
      # Variável necessária para o Firebase Admin não travar ao iniciar o contexto
      # Os testes @WebMvcTest mockam os beans Firebase, então nenhum arquivo real é necessário
      FIREBASE_CONFIG_PATH: /dev/null
    command: >
      mvn test -Dspring.profiles.active=test --no-transfer-progress -Dsurefire.useFile=false

  # ─── Testes do Frontend (Angular + Karma + Chromium Headless) ────────────────
  # Usa a imagem oficial node:20 com Chromium instalado via apt.
  # O karma.conf.js configura ChromeHeadlessNoSandbox (sem sandbox, adequado para Docker).
  frontend-test:
    image: node:20-bullseye
    container_name: frontend-test
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Cache do node_modules entre execuções
      - node_modules_cache:/app/node_modules
    environment:
      # Chromium no container não tem DISPLAY — deve rodar em modo headless
      CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
      # Informa ao Karma onde encontrar o Chrome/Chromium instalado no container
      CHROME_BIN: /usr/bin/chromium
    command: >
      bash -c "
        echo '==> Instalando Chromium...' &&
        apt-get update -qq &&
        apt-get install -y -qq chromium &&
        echo '==> Instalando dependências npm...' &&
        npm install --silent &&
        echo '==> Executando testes Angular...' &&
        npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --karma-config=karma.conf.js
      "

volumes:
  maven_cache:
  node_modules_cache:
